<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0d12" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fairy" />
    <title>Fairy</title>
    <style>
      /* H.D.D. terminal: near-black, electric cyan, warning amber, hazard stripes, hairline rules.
         Every panel is a rectangle with a cut corner; nothing is a rounded card. */
      :root {
        --bg: #0a0d12;
        --panel: #121822;
        --line: #22303d;
        --line-2: #2d3f50;
        --cyan: #3ddcff;
        --cyan-dim: #1d7f96;
        --amber: #ffc400;
        --amber-dim: #8a6c11;
        --text: #eaf6ff;
        --dim: #6f8595;
        --bad: #ff4d6a;
        --me: #0d2f3c;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.65 "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(61, 220, 255, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(61, 220, 255, 0.045) 1px, transparent 1px);
        background-size: 40px 40px, 40px 40px;
        mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 80%);
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px);
        pointer-events: none;
        mix-blend-mode: screen;
      }

      header {
        position: relative;
        z-index: 2;
        padding: calc(10px + env(safe-area-inset-top)) 14px 0;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(14, 19, 26, 0.98), rgba(10, 13, 18, 0.86));
        backdrop-filter: blur(6px);
      }
      .top { display: flex; align-items: flex-end; gap: 12px; }
      .mark { display: flex; flex-direction: column; gap: 2px; }
      .mark b {
        font: 700 20px/1 "Consolas", "SF Mono", ui-monospace, monospace;
        letter-spacing: 0.36em;
        color: #fff;
        text-shadow: 0 0 10px rgba(61, 220, 255, 0.75), 1.5px 0 rgba(255, 196, 0, 0.35), -1.5px 0 rgba(61, 220, 255, 0.5);
      }
      .mark i {
        font: 400 8px/1.5 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.34em;
        font-style: normal;
        color: var(--cyan-dim);
      }
      #doing {
        font: 400 10px/1.4 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.1em;
        color: var(--dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
        min-width: 0;
        padding-bottom: 2px;
      }
      #notify {
        font: 700 9px/1 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.16em;
        padding: 7px 9px;
        background: rgba(255, 196, 0, 0.1);
        color: var(--amber);
        border: 1px solid var(--amber-dim);
        clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        cursor: pointer;
      }
      #notify:disabled { color: var(--dim); border-color: var(--line); background: transparent; }

      /* the readout strip: system, link state, clock — the thing that makes it a terminal */
      .readout {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px -14px 0;
        padding: 5px 14px;
        font: 400 9px/1.2 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.18em;
        color: var(--dim);
        border-top: 1px solid var(--line);
      }
      .readout b { color: var(--cyan); font-weight: 400; }
      #state { color: var(--cyan); }
      #state.bad { color: var(--bad); }
      #clock { margin-left: auto; color: var(--dim); font-variant-numeric: tabular-nums; }

      /* hazard stripes: the divider the game puts between a header and a body */
      .hazard {
        height: 5px;
        background: repeating-linear-gradient(-45deg, var(--amber) 0 6px, #0a0d12 6px 14px);
        opacity: 0.55;
        margin: 0 -14px;
      }

      main {
        position: relative;
        z-index: 1;
        flex: 1;
        overflow-y: auto;
        padding: 16px 14px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scrollbar-width: thin;
        scrollbar-color: var(--cyan-dim) transparent;
      }
      .row { max-width: 86%; position: relative; padding: 16px 13px 10px; white-space: pre-wrap; word-break: break-word; }
      .her {
        align-self: flex-start;
        background: linear-gradient(135deg, rgba(18, 24, 34, 0.95), rgba(12, 16, 22, 0.95));
        border-left: 2px solid var(--cyan);
        border-top: 1px dashed rgba(61, 220, 255, 0.22);
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
      }
      .me {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--me), #0a1c24);
        border-right: 2px solid var(--amber);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px));
      }
      /* a dim index in the corner, like a log line */
      .row::before {
        position: absolute;
        top: 4px;
        font: 400 9px/1 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.1em;
        color: var(--dim);
        opacity: 0.65;
      }
      .her::before { content: attr(data-index); left: 13px; color: var(--cyan-dim); }
      .me::before { content: attr(data-index); right: 13px; color: var(--amber-dim); }
      .row img { display: block; max-width: 100%; margin-top: 8px; border: 1px solid var(--line-2); }
      .note {
        align-self: stretch;
        color: var(--dim);
        font: 400 11px/1.5 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.06em;
        text-align: left;
        padding-left: 14px;
        position: relative;
      }
      .note::before { content: ">"; position: absolute; left: 0; color: var(--cyan-dim); }
      /* the newest thing she said gets a live cursor */
      .cursor::after {
        content: "▌";
        color: var(--cyan);
        animation: blink 1.1s steps(1) infinite;
        margin-left: 2px;
      }
      @keyframes blink { 50% { opacity: 0; } }

      footer {
        position: relative;
        z-index: 2;
        border-top: 1px solid var(--line);
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        display: flex;
        gap: 7px;
        align-items: stretch;
        background: linear-gradient(0deg, rgba(14, 19, 26, 0.99), rgba(10, 13, 18, 0.9));
        backdrop-filter: blur(6px);
      }
      input, button { font: inherit; color: inherit; }
      .field {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        border: 1px solid var(--line-2);
        background: var(--panel);
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      }
      .field span { color: var(--cyan-dim); font: 400 14px/1 "Consolas", ui-monospace, monospace; padding-left: 10px; }
      #text {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        padding: 11px 10px;
        outline: none;
      }
      .field:focus-within { border-color: var(--cyan-dim); }
      button {
        background: var(--cyan);
        color: #04141a;
        border: 0;
        padding: 0 16px;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.1em;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; }
      button.ghost {
        background: var(--panel);
        color: var(--cyan-dim);
        border: 1px solid var(--line-2);
        font-size: 16px;
        line-height: 1;
        padding: 0 11px;
      }
      button.ghost:hover { color: var(--cyan); border-color: var(--cyan-dim); }

      #pair {
        position: relative;
        z-index: 1;
        display: none;
        flex-direction: column;
        gap: 11px;
        padding: 22px 16px;
        max-width: 460px;
        width: 100%;
        margin: 0 auto;
      }
      #pair.show { display: flex; }
      #pair::before {
        content: "ACCESS // 需要配对";
        font: 400 10px/1 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.3em;
        color: var(--amber);
      }
      #pair p { color: var(--dim); font-size: 12.5px; margin: 0; }
      #pair a { color: var(--cyan); }
      #pair input {
        background: var(--panel);
        border: 1px solid var(--line-2);
        padding: 12px 13px;
        clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        outline: none;
      }
      #pair input:focus { border-color: var(--cyan-dim); }
      #pairError { color: var(--bad); }
      .hidden { display: none !important; }

      /* boot: a couple of lines, then gone. Tap to skip. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        font: 400 11px/1.9 "Consolas", ui-monospace, monospace;
        letter-spacing: 0.16em;
        color: var(--cyan-dim);
        transition: opacity 0.35s ease;
      }
      #boot b { color: var(--cyan); letter-spacing: 0.4em; font-size: 15px; }
      #boot.fade { opacity: 0; pointer-events: none; }
      #boot .bar { height: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0; background: var(--cyan); animation: load 0.9s ease-out forwards; }
      @keyframes load { to { width: 100%; } }
    </style>
  </head>
  <body>
    <div id="boot">
      <b>FAIRY</b>
      <div>H.D.D. SYSTEM // 主机连接中</div>
      <div>butler-online …</div>
      <div class="bar"><i></i></div>
    </div>

    <header>
      <div class="top">
        <span class="mark"><b>FAIRY</b><i>H.D.D. · BUTLER · v10</i></span>
        <span id="doing"></span>
        <button id="notify" class="hidden">开启通知</button>
      </div>
      <div class="readout">
        <span>SYS</span><b>FAIRY</b>
        <span>LINK</span><span id="state">未连接</span>
        <span id="clock">--:--:--</span>
      </div>
      <div class="hazard"></div>
    </header>

    <section id="pair">
      <p>第一次用：在宿主上跑 <code>node scripts/fairy.mjs pair</code>，把打印出来的配对码填进来（六位数字，或者你自己设的那一串）。</p>
      <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="配对码" />
      <input id="name" placeholder="这台设备的名字" />
      <button id="pairButton">配对</button>
      <p id="pairError" class="hidden"></p>
      <p>装了她的 App 之后，页面关着也能收到她：<a href="./download/fairy.apk">下载 Android 版</a></p>
    </section>

    <main id="log" class="hidden"></main>

    <footer id="composer" class="hidden">
      <button id="attach" class="ghost" title="发图片" aria-label="发图片">＋</button>
      <button id="sendFile" class="ghost" title="发文本文件（.md/.txt）" aria-label="发文本文件">≡</button>
      <input id="file" type="file" accept="image/*" multiple hidden />
      <input id="doc" type="file" accept=".md,.markdown,.txt,.json,.csv,.yml,.yaml,text/plain,text/markdown" hidden />
      <label class="field"><span>&gt;</span><input id="text" placeholder="和她说点什么" autocomplete="off" /></label>
      <button id="send">发送</button>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
