<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>Fairy</title>
    <style>
      :root {
        --bg: #101014;
        --card: #1a1a21;
        --line: #2a2a33;
        --text: #e8e8ee;
        --dim: #9a9aa6;
        --accent: #7aa2f7;
        --bad: #f7768e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px calc(12px + env(safe-area-inset-top));
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      header b { font-size: 16px; letter-spacing: 0.04em; }
      #state { color: var(--dim); font-size: 12px; }
      #state.bad { color: var(--bad); }
      main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .row { max-width: 82%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
      .her { background: var(--card); align-self: flex-start; border-bottom-left-radius: 4px; }
      .me { background: color-mix(in srgb, var(--accent) 22%, var(--card)); align-self: flex-end; border-bottom-right-radius: 4px; }
      .note { align-self: center; color: var(--dim); font-size: 12px; text-align: center; }
      footer {
        border-top: 1px solid var(--line);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
      }
      input, button { font: inherit; color: inherit; }
      input {
        flex: 1;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        min-width: 0;
      }
      button {
        background: var(--accent);
        color: #0b0b10;
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-weight: 600;
      }
      button:disabled { opacity: 0.4; }
      #pair { padding: 24px 16px; display: none; flex-direction: column; gap: 12px; max-width: 420px; margin: 0 auto; width: 100%; }
      #pair.show { display: flex; }
      #pair p { color: var(--dim); font-size: 13px; margin: 0; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <b>Fairy</b>
      <span id="state">未连接</span>
    </header>

    <section id="pair">
      <p>第一次用：在宿主上跑 <code>node scripts/fairy.mjs pair</code>，把打印出来的配对码填进来（六位数字，或者你自己设的那一串）。</p>
      <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="配对码" />
      <input id="name" placeholder="这台设备的名字" />
      <button id="pairButton">配对</button>
      <p id="pairError" class="hidden"></p>
    </section>

    <main id="log" class="hidden"></main>

    <footer id="composer" class="hidden">
      <input id="text" placeholder="和她说点什么" autocomplete="off" />
      <button id="send">发送</button>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
