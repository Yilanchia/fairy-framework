# /etc/systemd/system/fairy.service.d/sandbox.conf
#
# Her agent runs shell commands. Even with a paired token, it must not be able to read the blog's
# source, its database, the panel, or root's own files. On this machine all of those live under
# /www (nginx, the site, MySQL's data, the panel), and the owner's own backups under /root.
#
# It is a drop-in rather than part of the unit so the base unit stays readable, and so a host
# without this layout can drop it. Nothing about the blog changes: these paths simply do not exist
# inside her mount namespace.
[Service]
InaccessiblePaths=/www
InaccessiblePaths=/root
ProtectSystem=strict
ReadWritePaths=/home/fairy
