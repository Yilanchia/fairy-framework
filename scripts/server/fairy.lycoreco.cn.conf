# /www/server/panel/vhost/nginx/fairy.lycoreco.cn.conf
#
# Fairy's own entrance. It shares the machine with the owner's blog and touches nothing of it:
# this file answers only the hostname fairy.lycoreco.cn, and only for the paths she serves.
#
# What comes out: her page (/fairy/app) and her channel (/fairy/link). What does not: the DSH
# web UI, /api, sessions, the life file — those stay on 127.0.0.1.
#
# The certificate is Let's Encrypt's, issued with certbot's webroot method against
# /www/wwwroot/fairy-acme. Renewal is certbot.timer's job; a deploy hook in
# /etc/letsencrypt/renewal-hooks/deploy reloads nginx after a successful renewal.

server {
    listen 80;
    server_name fairy.lycoreco.cn;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/fairy-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fairy.lycoreco.cn;

    ssl_certificate     /etc/letsencrypt/live/fairy.lycoreco.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fairy.lycoreco.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FairyTLS:1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 1m;

    location ^~ /fairy/app {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /fairy/link/v1 {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /fairy/link/pair {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
