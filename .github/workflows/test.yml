name: test

# She needs two repositories: this one, and the life kernel she is built on. The kernel is checked
# out as a sibling directory because the dependency is a `link:` path, not a registry version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: fairy-framework

      - name: her life kernel (the link target)
        uses: actions/checkout@v5
        with:
          repository: Yilanchia/isla
          ref: life-kernel
          path: isla

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            isla/pnpm-lock.yaml
            fairy-framework/pnpm-lock.yaml

      - name: build the kernel first — `life...` also builds its @isla/* dependencies
        working-directory: isla
        run: |
          set +e
          { pnpm install --no-frozen-lockfile && pnpm --filter "@isla/life..." build; } > /tmp/kernel.log 2>&1
          code=$?
          tail -c 3000 /tmp/kernel.log >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: install
        working-directory: fairy-framework
        run: |
          set +e
          pnpm install --no-frozen-lockfile > /tmp/install.log 2>&1
          code=$?
          # A failed install must explain itself somewhere readable without signing in.
          tail -c 3000 /tmp/install.log >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: test
        working-directory: fairy-framework
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          code=$?
          tail -c 4000 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: smoke — a real host has to boot her, not just compile
        working-directory: fairy-framework
        run: |
          set +e
          pnpm smoke > /tmp/smoke.log 2>&1
          code=$?
          tail -c 3000 /tmp/smoke.log >> "$GITHUB_STEP_SUMMARY"
          exit $code
